name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

# Two pushes in quick succession would otherwise race while replacing the same release.
concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore SimpleAranet4Client/SimpleAranet4Client.csproj

      - name: Build APK
        run: >
          dotnet publish
          SimpleAranet4Client/SimpleAranet4Client.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormat=apk
          --no-restore

      # publish/ contains both the unsigned package and the signed one, so an unfiltered
      # *.apk picks up two files. Keep only the signed APK and give it a stable name.
      - name: Stage the signed APK
        run: |
          mkdir -p artifact
          cp SimpleAranet4Client/bin/Release/net10.0-android/publish/*-Signed.apk \
             artifact/SimpleAranet4Client.apk
          ls -l artifact

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleAranet4Client-APK
          path: artifact/SimpleAranet4Client.apk
          if-no-files-found: error

      # Workflow artifacts are always zipped on download, release assets are not. The release
      # is deleted and recreated so its tag moves to the current commit, which keeps
      # releases/latest/download/SimpleAranet4Client.apk pointing at the newest build.
      # It must not be a prerelease: the /releases/latest/ redirect skips those.
      - name: Refresh the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest artifact/SimpleAranet4Client.apk \
            --title "Latest build" \
            --notes "Built from main at ${GITHUB_SHA::7}."
